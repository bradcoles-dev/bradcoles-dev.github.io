<!--
  Title card template — 1920x1080 (16:9)
  Use as a video intro / section title slide.
  Edit text content directly, or open in Figma/Inkscape to adjust layout.
  Headshot path is relative to this file (../images/...).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Syne:wght@700;800&amp;display=swap');
    </style>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0a0e1a"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect x="0" y="0" width="1920" height="6" fill="#3b82f6"/>
  <rect x="0" y="1074" width="1920" height="6" fill="#3b82f6"/>

  <!-- Logo mark, top-left -->
  <g transform="translate(80, 60)">
    <rect width="120" height="100" rx="16" fill="#0a0e1a" stroke="#1f2937" stroke-width="2"/>
    <text x="60" y="48" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="38" fill="#e5e7eb">bc</text>
    <text x="60" y="84" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="26" fill="#60a5fa">dev<tspan>_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="320" font-family="'JetBrains Mono', monospace" font-size="28" fill="#60a5fa" letter-spacing="4">// MICROSOFT FABRIC · DATA ENGINEERING</text>

  <!-- Title -->
  <text x="80" y="410" font-family="'Syne', sans-serif" font-weight="800" font-size="56" fill="#e5e7eb">Delta Table Maintenance</text>
  <text x="80" y="480" font-family="'Syne', sans-serif" font-weight="800" font-size="56" fill="#60a5fa">in Microsoft Fabric</text>

  <!-- Subtitle -->
  <text x="80" y="550" font-family="'JetBrains Mono', monospace" font-size="32" fill="#9ca3af">A 2026 Practitioner's Guide</text>

  <!-- Code motif panel -->
  <g transform="translate(1240, 360)">
    <rect width="600" height="340" rx="12" fill="#0d1117" stroke="#1f2937" stroke-width="2"/>
    <circle cx="36" cy="36" r="8" fill="#ef4444"/>
    <circle cx="64" cy="36" r="8" fill="#f59e0b"/>
    <circle cx="92" cy="36" r="8" fill="#10b981"/>
    <text x="36" y="100" font-family="'JetBrains Mono', monospace" font-size="24" fill="#9ca3af">spark.sql(f"""</text>
    <text x="56" y="138" font-family="'JetBrains Mono', monospace" font-size="24" fill="#60a5fa">  OPTIMIZE {table}</text>
    <text x="56" y="176" font-family="'JetBrains Mono', monospace" font-size="24" fill="#60a5fa">  ZORDER BY (event_date)</text>
    <text x="36" y="214" font-family="'JetBrains Mono', monospace" font-size="24" fill="#9ca3af">""")</text>
    <text x="36" y="280" font-family="'JetBrains Mono', monospace" font-size="24" fill="#10b981"># VACUUM RETAIN 168 HOURS</text>
  </g>

  <!-- QR code -->
  <g transform="translate(1440, 772)">
    <rect width="200" height="230" rx="14" fill="#e5e7eb"/>
    <svg x="16" y="16" width="168" height="168" viewBox="0 0 37 37" shape-rendering="crispEdges">
      <path fill="#e5e7eb" d="M0 0h37v37H0z"/>
      <path stroke="#0a0e1a" d="M4 4.5h7m2 0h1m2 0h4m1 0h3m2 0h7M4 5.5h1m5 0h1m6 0h2m3 0h1m1 0h1m1 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m1 0h2m1 0h2m7 0h1m1 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h1m3 0h1m4 0h1m1 0h2m1 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m2 0h1m1 0h1m1 0h7m2 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m2 0h1m1 0h1m1 0h2m1 0h3m3 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M13 11.5h3m1 0h1m1 0h2m3 0h1M7 12.5h2m1 0h2m1 0h1m2 0h1m1 0h1m3 0h2m5 0h2M4 13.5h1m1 0h3m3 0h1m2 0h1m4 0h2m2 0h1m2 0h3m1 0h1M4 14.5h1m2 0h2m1 0h1m1 0h3m1 0h1m2 0h2m4 0h3m1 0h1M6 15.5h2m1 0h1m2 0h5m1 0h1m3 0h3m4 0h1m2 0h1M6 16.5h1m1 0h1m1 0h2m1 0h1m2 0h1m1 0h1m1 0h2m3 0h2m2 0h1m1 0h1M11 17.5h1m1 0h1m2 0h1m1 0h2m1 0h2m3 0h1m1 0h1m1 0h1m1 0h1M4 18.5h1m1 0h1m1 0h1m1 0h3m1 0h1m1 0h2m1 0h1m3 0h1m2 0h2m1 0h1m2 0h1M5 19.5h2m1 0h1m4 0h4m1 0h1m1 0h5m1 0h1m1 0h4M4 20.5h1m1 0h7m1 0h1m1 0h2m1 0h1m1 0h2m1 0h1m2 0h1m1 0h1m1 0h1M4 21.5h1m1 0h2m1 0h1m1 0h1m1 0h3m1 0h1m2 0h4m3 0h4M4 22.5h2m1 0h1m1 0h2m1 0h1m3 0h3m1 0h1m1 0h3m4 0h2m1 0h1M4 23.5h3m1 0h2m3 0h3m3 0h2m1 0h1m2 0h2m1 0h1m1 0h1m1 0h1M4 24.5h2m4 0h1m1 0h2m4 0h1m1 0h2m1 0h8m1 0h1M12 25.5h2m2 0h2m2 0h3m1 0h1m3 0h3M4 26.5h7m1 0h1m1 0h4m4 0h3m1 0h1m1 0h1m1 0h1M4 27.5h1m5 0h1m2 0h1m2 0h2m3 0h4m3 0h2m2 0h1M4 28.5h1m1 0h3m1 0h1m1 0h3m6 0h1m1 0h6m3 0h1M4 29.5h1m1 0h3m1 0h1m1 0h1m3 0h1m2 0h1m2 0h1m4 0h1m2 0h2M4 30.5h1m1 0h3m1 0h1m9 0h1m1 0h1m1 0h2m1 0h2m2 0h2M4 31.5h1m5 0h1m4 0h1m1 0h1m2 0h2m1 0h1m1 0h2m1 0h3m1 0h1M4 32.5h7m2 0h1m1 0h1m2 0h1m1 0h1m2 0h2m2 0h3"/>
    </svg>
    <text x="100" y="210" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" fill="#0a0e1a" letter-spacing="0.5">bradcoles.dev</text>
  </g>

  <!-- Presenter footer -->
  <g transform="translate(80, 880)">
    <image href="../images/Head_shot-removebg-preview.png" x="0" y="0" width="140" height="140"/>
    <text x="170" y="40" font-family="'Syne', sans-serif" font-weight="700" font-size="44" fill="#e5e7eb">Brad Coles</text>
    <text x="170" y="85" font-family="'JetBrains Mono', monospace" font-size="28" fill="#9ca3af">Senior Data Engineering Consultant</text>
