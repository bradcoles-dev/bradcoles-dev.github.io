<!--
  YouTube thumbnail template — 1280x720 (16:9)
  High-contrast, designed to read at small sizes.
  Edit text content directly, or open in Figma/Inkscape to adjust layout.
  Headshot path is relative to this file (../images/...).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Syne:wght@700;800&amp;display=swap');
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="4" y="4" width="1272" height="712" fill="none" stroke="#3b82f6" stroke-width="8"/>

  <!-- "2026 GUIDE" badge -->
  <g transform="translate(60, 50)">
    <rect width="200" height="60" rx="30" fill="#3b82f6"/>
    <text x="100" y="40" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" fill="#0a0e1a">2026 GUIDE</text>
  </g>

  <!-- Headline -->
  <text x="60" y="250" font-family="'Syne', sans-serif" font-weight="800" font-size="80" fill="#e5e7eb">DELTA TABLE</text>
  <text x="60" y="345" font-family="'Syne', sans-serif" font-weight="800" font-size="80" fill="#60a5fa">MAINTENANCE</text>
  <text x="60" y="410" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="36" fill="#9ca3af">in Microsoft Fabric</text>

  <!-- Headshot (bleeds off bottom-right corner) -->
  <circle cx="1150" cy="520" r="220" fill="#111827" stroke="#3b82f6" stroke-width="6"/>
  <image href="../images/Head_shot-removebg-preview.png" x="950" y="320" width="400" height="400"/>

  <!-- Footer brand -->
  <g transform="translate(60, 626)">
    <rect width="90" height="68" rx="12" fill="#0a0e1a" stroke="#1f2937" stroke-width="2"/>
    <text x="45" y="34" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="28" fill="#e5e7eb">bc</text>
    <text x="45" y="58" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#60a5fa">dev<tspan>_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    <text x="110" y="44" font-family="'JetBrains Mono', monospace" font-size="30" fill="#9ca3af">bradcoles.dev</text>
  </g>
</svg>
